name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # n8n-workflow (devDep) pulls isolated-vm@^6 which requires Node >=22.
        # The published node stays Node 20 compatible at runtime (n8n-workflow is a peerDep,
        # isolated-vm is not in the runtime tree) — only the dev/test toolchain needs >=22.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
