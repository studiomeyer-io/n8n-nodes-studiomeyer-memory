name: Publish to npm with provenance

# Required for n8n Verified Community Nodes (effective May 1, 2026):
# https://docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes/
#
# This workflow runs on every version tag push (v*.*.*) and publishes
# the package to npm with a provenance attestation. The provenance
# statement cryptographically links the published package to this
# GitHub Actions run, the source commit, and the workflow file —
# making the supply chain auditable.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Skip if this version is already on npm
        id: npmcheck
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER liegt bereits auf npm - Publish wird uebersprungen"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with provenance
        if: steps.npmcheck.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
